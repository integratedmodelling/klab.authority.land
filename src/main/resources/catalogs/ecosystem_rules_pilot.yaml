# Invented rule fixtures, not official classification definitions.
schemaVersion: 2
id: "ecosystem_rules_pilot"
title: "Typed ecosystem rules: invented test fixtures"
domain: "ECOSYSTEM"
version: "draft-1"
sourceVersion: "GET 2.1 / EUNIS 2021 source-class inspirations; rule prototype 2"
source: "https://www.eea.europa.eu/en/datahub/datahubitem-view/638330ea-90e6-4e41-81ea-e70f25ae7117/"
tentative: true
acceptsProposals: false
notes:
  - "Separate opt-in examples for the typed rule API. They do not replace or refine official GET/EUNIS definitions."
  - "The pH bounds, annual six-month inundation and 3:1 duration are deliberately invented. No numeric class crosswalk is asserted."
entries:
  -
    code: "T17"
    alias: "AcidBeechSoilRule"
    label: "Acid-soil beech forest: invented pH fixture"
    expression: "ecosystem.seed:Ecosystem(physical:HorizontalArrangement(ecosystem.seed:Beech),ecosystem.seed:Substrate(ecosystem.seed:AcidSoil))"
    source: "https://www.eea.europa.eu/en/datahub/datahubitem-view/638330ea-90e6-4e41-81ea-e70f25ae7117/"
    notes:
      - "Invented executable-structure fixture inspired by this source class. All thresholds, supports, modalities and prototype concepts require community review; not an official class definition."
    rule:
      schemaVersion: 2
      composition: "ecosystem.seed:Ecosystem(physical:HorizontalArrangement(ecosystem.seed:Beech),ecosystem.seed:Substrate(ecosystem.seed:AcidSoil))"
      participants:
        -
          id: "soil"
          path:
            - 1
          bearer: "ecosystem.rules.seed:SoilPatch"
      profiles: []
      criteria:
        kind: "constraint"
        participant: "soil"
        observable: "ecosystem.rules.seed:SoilPH"
        unit: "1"
        minimum: null
        minimumInclusive: false
        maximum: 5
        maximumInclusive: false
        support:
          space: "habitat-patch"
          time: "reference-year"
          aggregation: "annual-mean"
      provenance:
        source: "https://www.eea.europa.eu/en/datahub/datahubitem-view/638330ea-90e6-4e41-81ea-e70f25ae7117/"
        sourceCode: "T17"
        note: "Invented executable-structure fixture inspired by this source class. All thresholds, supports, modalities and prototype concepts require community review; not an official class definition."
