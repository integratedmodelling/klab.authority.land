    code: "TF1.4"
    alias: "SeasonalMarshCycleRule"
    label: "Seasonal marsh: invented duration and succession fixture"
    expression: "ecosystem.seed:HydroperiodCycle(+++physical:HorizontalArrangement(ecosystem.seed:InundatedPhase),+physical:HorizontalArrangement(ecosystem.seed:ExposedPhase))"
    source: "https://global-ecosystems.org/explore/groups/TF1.4"
    notes:
      - "Invented executable-structure fixture inspired by this source class. All thresholds, supports, modalities and prototype concepts require community review; not an official class definition."
    rule:
      schemaVersion: 2
      composition: "ecosystem.seed:HydroperiodCycle(+++physical:HorizontalArrangement(ecosystem.seed:InundatedPhase),+physical:HorizontalArrangement(ecosystem.seed:ExposedPhase))"
      participants:
        -
          id: "marsh"
          path: []
          bearer: "ecosystem.rules.seed:WetlandPatch"
        -
          id: "wet"
          path:
            - 0
          bearer: "ecosystem.rules.seed:WetlandPatch"
        -
          id: "dry"
          path:
            - 1
          bearer: "ecosystem.rules.seed:WetlandPatch"
      profiles:
        -
          path: []
          interpretation: "urn:land:profiles:hydroperiod-duration:1"
          measure: "DURATION"
          order: "CYCLE"
          support:
            space: "habitat-patch"
            time: "one-unanchored-cycle"
            aggregation: "total-phase-occupancy"
          exhaustive: false
      criteria:
        kind: "group"
        operator: "ALL"
        minimum: 0
        children:
          -
            kind: "constraint"
            participant: "marsh"
            observable: "ecosystem.rules.seed:InundatedDuration"
            unit: "month"
            minimum: 6
            minimumInclusive: true
            maximum: null
            maximumInclusive: false
            support:
              space: "habitat-patch"
              time: "reference-year"
              aggregation: "total-duration"
          -
            kind: "relationship"
            source: "wet"
            target: "dry"
            type: "TEMPORAL"
            relation: "urn:land:relations:precedes-within-cycle:1"
            support:
              space: "habitat-patch"
              time: "one-unanchored-cycle"
              aggregation: "total-phase-occupancy"
      provenance:
        source: "https://global-ecosystems.org/explore/groups/TF1.4"
        sourceCode: "TF1.4"
        note: "Invented executable-structure fixture inspired by this source class. All thresholds, supports, modalities and prototype concepts require community review; not an official class definition."
