    rule:
      schemaVersion: 2
      composition: "ecosystem.seed:Ecosystem(physical:HorizontalArrangement(landcover.seed:SclerophyllousVegetation))"
      participants:
        -
          id: "patch"
          path: []
          bearer: "ecosystem.rules.seed:EcosystemPatch"
        -
          id: "canopy"
          path:
            - 0
            - 0
          bearer: "ecosystem.rules.seed:VegetationStand"
      profiles: []
      criteria:
        kind: "group"
        operator: "ALL"
        minimum: 0
        children:
          -
            kind: "qualification"
            participant: "canopy"
            type: "ATTRIBUTE"
            predicate: "ecosystem.rules.seed:Sclerophyllous"
            present: true
            support:
              space: "habitat-patch"
              time: "reference-year"
              aggregation: "annual-mean"
          -
            kind: "occurrent"
            participant: "patch"
            type: "PROCESS"
            concept: "ecosystem.rules.seed:Regeneration"
            present: true
            support:
              space: "habitat-patch"
              time: "reference-year"
              aggregation: "annual-mean"
          -
            kind: "typical"
            criterion:
              kind: "occurrent"
              participant: "patch"
              type: "EVENT"
              concept: "ecosystem.rules.seed:Fire"
              present: true
              support:
                space: "habitat-patch"
                time: "reference-year"
                aggregation: "annual-mean"
            note: "A recent fire is illustrative only; it does not establish a fire-dependent regime."
          -
            kind: "relationship"
            source: "patch"
            target: "canopy"
            type: "SEMANTIC"
            relation: "ecosystem.rules.seed:HasVegetation"
            support:
              space: "habitat-patch"
              time: "reference-year"
              aggregation: "annual-mean"
